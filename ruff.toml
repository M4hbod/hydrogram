line-length = 99

[lint]
select = [
    "FURB", # refurb
    "I",    # isort
    "E",    # pycodestyle: error
    "W",    # pycodestyle: warning
    "UP",   # pyupgrade
    "F",    # pyflakes
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "PERF", # perflint
    "N",    # pep8-naming
    "RUF",  # ruff
    "G",    # flake8-logging-format
    "TID",  # flake8-tidy-imports
    "TC",   # flake8-type-checking
    "FA",   # flake8-future-annotations
    "PL",   # pylint
    "B",    # flake8-bugbear: mutable default arguments, and the rest of that family
]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF067", # Allow implementation code in __init__.py files (library design pattern)
    "E203",
    "PERF203",
    "PLR09",
    "PLR2004",
    "PLR1702",
    "PLW1514",
    "PLW2901",
    "PLW0603",
    "FURB189", # This rule is unsafe and not relevant for us.
    # `zero_datetime()` and `BotCommandScopeDefault()` are constants dressed as calls; the
    # "evaluated once at import" hazard B008 warns about does not apply to them.
    "B008",
    # PLR6301 fires on a polymorphic method whose own body has no use for `self`.
    # Half the `write` and `_parse` overrides in this library are exactly that: the
    # signature belongs to the interface, not to the implementation, and turning one
    # of them into a staticmethod would break the call through the base class.
    "PLR6301",
    # B903 fires on any plain data-holding class. This library is full of them by design, and a
    # test stub does not become clearer as a namedtuple.
    "B903",
]
preview = true

# Test doubles are held to the shape of what they stand in for, not to what
# their own body happens to need: a stub that replaces an async I/O call stays
# `async` with nothing to await (RUF029), and one that replaces a bound method
# keeps `self` whether or not it reads it (PLR6301).
[lint.per-file-ignores]
"tests/**" = ["RUF029"]

[lint.isort]
known-first-party = ["pyrogram"]

[format]
docstring-code-format = true
preview = true
