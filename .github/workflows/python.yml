name: Pyrogram

on: [push, pull_request]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # The full matrix on every push is more signal than it is worth: the
        # oldest and newest interpreters catch the syntax and deprecation
        # problems, and Linux catches everything else. Keep macOS and Windows
        # on the ends of the range only -- storage paths and the asyncio event
        # loop policy are what differ there, not the language version.
        exclude:
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.12" }

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Invoked directly rather than through `make api`: GitHub's Windows
      # runners have no make on PATH.
      - name: Generate API
        run: |
          uv run python -c "from compiler.api.compiler import start; start()"
          uv run python -c "from compiler.errors.compiler import start; start()"

      - name: Run tests
        run: uv run pytest -m "not integration"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Generate API
        run: uv run make api

      # --cov-fail-under lives in .coveragerc so the gate is the same number
      # locally (`make test-cov`) and here.
      - name: Run tests with coverage
        run: uv run make test-cov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
