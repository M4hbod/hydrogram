name: Check style

on: [push, pull_request]

concurrency:
  group: style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Run the same hooks contributors run locally, so CI and the pre-commit
      # hook can never disagree about what "clean" means. This covers ruff-check
      # and ruff-format as well as the merge-conflict, private-key, whitespace,
      # TOML/YAML and NEWS-fragment checks.
      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # A ratchet, not a gate on a clean tree: most findings are resolve_peer
      # returning a union of input peers where a raw constructor wants one
      # specific kind, which is right at runtime and wrong in the annotations.
      # New code may not add to the count; see dev_tools/type_ratchet.py.
      - name: Type ratchet
        run: uv run python dev_tools/type_ratchet.py
